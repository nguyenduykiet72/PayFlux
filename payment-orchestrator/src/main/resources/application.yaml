spring:
  application:
    name: payment-orchestrator
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5678/payflux_db
    username: postgres
    password: 123456789
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  data:
    redis:
      host: localhost
      port: 6379
  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true
    schemas:
      - public

mybatis:
  mapper-locations: classpath:mappers/*.xml
  type-aliases-package: com.payflux.payment_orchestrator.domain
  configuration:
    map-underscore-to-camel-case: true
  type-handlers-package: com.payflux.payment_orchestrator.infrastructure.persistence

server:
  port: 8081

grpc:
  client:
    vnpay-adapter:
      address: static://localhost:9101
      negotiation-type: plaintext

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - prometheus

payflux:
  shared:
    web:
      exception-handler-enabled: true
    observability:
      correlation-id-enabled: true

logging:
  level:
    "[net.devh.boot.grpc]": info
    "[org.flywaydb]": info
